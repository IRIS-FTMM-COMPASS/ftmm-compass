name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security:
    name: Security & Secret Leak Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify no classified or sensitive files committed
        run: |
          echo "Scanning git-tracked files for secret or classified patterns..."
          if git ls-files | grep -E "(^Ekstrak/|/Ekstrak/|\.env$|\.env\.local$|\.env\.production$|\.pem$|\.key$|\.crt$|\.pfx$|\.p12$|id_rsa|id_ed25519)"; then
            echo "[ERROR] Classified or secret files found committed in Git tree!"
            exit 1
          fi
          if git grep -I -n -E "BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|AIza[0-9A-Za-z_-]{35}" -- . ':!pnpm-lock.yaml'; then
            echo "[ERROR] Secret-like content found in tracked files!"
            exit 1
          fi
          echo "[PASS] Security Guard passed: No classified files or secret-like content found."

  frontend:
    name: Frontend Build & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Versi pnpm dibaca dari field packageManager di package.json.
      # Menambah input `version` bersamaan dengannya membuat action gagal.
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting with oxfmt
        run: pnpm format:check

      - name: Run frontend unit tests
        run: pnpm test:unit

      - name: Build frontend
        run: pnpm build

  database:
    name: Database Migrations & Seeding Integrity
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ftmm_compass_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Astral UV
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: uv sync --directory backend

      - name: Verify Alembic migration upgrade to head
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ftmm_compass_dev
        run: uv run --directory backend alembic upgrade head

      - name: Verify Alembic rollback reversibility (-1)
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ftmm_compass_dev
        run: |
          uv run --directory backend alembic downgrade -1
          uv run --directory backend alembic upgrade head

      - name: Verify Database Seeder idempotency (2x sequential runs)
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ftmm_compass_dev
        run: |
          uv run --directory backend python -m scripts.seed
          uv run --directory backend python -m scripts.seed

  backend:
    name: Backend Test Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ftmm_compass_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Astral UV
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: uv sync --directory backend

      - name: Static syntax and compilation check
        run: uv run python -m compileall -q backend

      - name: Python lint check with Ruff
        run: uv run --directory backend ruff check .

      # conftest membuat database sementara, menjalankan alembic, lalu seed katalog.
      - name: Run backend test suite
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ftmm_compass_dev
        run: uv run --directory backend python -m pytest tests -q

  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ftmm_compass_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ftmm_compass_e2e
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Astral UV
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install backend dependencies
        run: uv sync --directory backend

      - name: Migrate and seed E2E database
        run: |
          uv run --directory backend alembic upgrade head
          uv run --directory backend python -m scripts.seed_full_catalog
          uv run --directory backend python -m scripts.seed

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run Playwright E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker-build:
    name: Docker Image Build Guard
    runs-on: ubuntu-latest
    needs: [frontend, backend, database]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image (-q)
        run: docker build -q -f Dockerfile.backend -t ftmm-compass-gateway:ci .

      - name: Build Frontend Docker Image (-q)
        run: docker build -q -f Dockerfile.frontend -t ftmm-compass-frontend:ci .
